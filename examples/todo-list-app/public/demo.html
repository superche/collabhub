<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabHub · Live TODO Demo</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #edf2ee; color: #17231c; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 18px; background: #17231c; color: #f2f6f3; }
      header strong { font-size: 16px; }
      header span { color: #b9c7be; font-size: 12px; }
      header a { color: #d8f3df; font-size: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: calc(100vh - 54px); background: #b8c5bc; }
      section { min-width: 0; display: grid; grid-template-rows: 30px 1fr; background: white; }
      section > strong { display: flex; align-items: center; padding: 0 12px; background: #f5f8f6; color: #516158; font-size: 11px; letter-spacing: .08em; }
      iframe { width: 100%; height: 100%; border: 0; background: white; }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: auto; min-height: calc(100vh - 54px); } section { min-height: 720px; } header span { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <div><strong>CollabHub live demo</strong> <span>· two React clients, one server-authoritative room</span></div>
      <a href="https://github.com/superche/collabhub" target="_blank" rel="noreferrer">GitHub</a>
    </header>
    <main>
      <section><strong>ALICE</strong><iframe id="alice" title="Alice"></iframe></section>
      <section><strong>BOB</strong><iframe id="bob" title="Bob"></iframe></section>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const room = params.get('room') || `public-${crypto.randomUUID().slice(0, 8)}`
      if (!params.has('room')) { params.set('room', room); history.replaceState(null, '', `${location.pathname}?${params}`) }
      document.querySelector('#alice').src = `/?client=alice&draft=${encodeURIComponent(room)}`
      document.querySelector('#bob').src = `/?client=bob&draft=${encodeURIComponent(room)}`
    </script>
  </body>
</html>
