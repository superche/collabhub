<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/collabhub-mark.svg" />
    <title>CollabHub Product Hunt thumbnail</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: #edf1ed; }
      .mark { position: relative; width: 176px; height: 176px; border-radius: 52px; background: #237a53; box-shadow: 0 24px 60px #153c272b; }
      .node { position: absolute; width: 34px; height: 34px; border-radius: 50%; z-index: 2; }
      .left { left: 37px; top: 71px; background: #edf1ed; }
      .top { right: 37px; top: 35px; background: #f0c766; }
      .bottom { right: 37px; bottom: 35px; background: #70e3a9; }
      .line { position: absolute; left: 69px; width: 63px; height: 9px; border-radius: 9px; background: #edf1ed; transform-origin: left center; }
      .line-top { top: 78px; transform: rotate(-32deg); }
      .line-bottom { top: 92px; transform: rotate(32deg); }
    </style>
  </head>
  <body><div class="mark" aria-label="CollabHub"><i class="node left"></i><i class="node top"></i><i class="node bottom"></i><i class="line line-top"></i><i class="line line-bottom"></i></div></body>
</html>
