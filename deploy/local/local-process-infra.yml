name: collabhub-local-process

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabhub
      POSTGRES_PASSWORD: collabhub
      POSTGRES_DB: collabhub
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabhub -d collabhub"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [local-process-postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  local-process-postgres:
