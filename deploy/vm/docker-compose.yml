name: collabhub-vm

x-runtime: &runtime
  image: ${COLLABHUB_IMAGE:-ghcr.io/superche/collabhub:1.0.0}
  restart: unless-stopped
  network_mode: host
  env_file: ${COLLABHUB_ENV_FILE:-.env}
  environment:
    NODE_ENV: production
    DATABASE_URL_FILE: /run/secrets/database_url
    REDIS_URL_FILE: /run/secrets/redis_url
    INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    JWT_SHARED_SECRET_FILE: /run/secrets/jwt_shared_secret
    COLLABHUB_DOMAIN_PACK_CONFIG: /config/domain-pack.json
  secrets: [database_url, redis_url, internal_token, jwt_shared_secret]
  volumes:
    - ./domain-pack.json:/config/domain-pack.json:ro
  stop_grace_period: 45s

services:
  worker:
    <<: *runtime
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      JWT_SHARED_SECRET_FILE: /run/secrets/jwt_shared_secret
      COLLABHUB_DOMAIN_PACK_CONFIG: /config/domain-pack.json
      COLLABHUB_ROLE: worker
      INSTANCE_ID: ${NODE_NAME:-collabhub-node}-worker
      INTERNAL_URL: http://${PRIVATE_IP:?Set PRIVATE_IP in .env}:7100
      PORT: 7100
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7100/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  gateway:
    <<: *runtime
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      JWT_SHARED_SECRET_FILE: /run/secrets/jwt_shared_secret
      COLLABHUB_DOMAIN_PACK_CONFIG: /config/domain-pack.json
      COLLABHUB_ROLE: gateway
      INSTANCE_ID: ${NODE_NAME:-collabhub-node}-gateway
      PORT: 7000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

secrets:
  database_url:
    file: ${DATABASE_URL_FILE_PATH:-./secrets/database-url}
  redis_url:
    file: ${REDIS_URL_FILE_PATH:-./secrets/redis-url}
  internal_token:
    file: ${INTERNAL_TOKEN_FILE_PATH:-./secrets/internal-token}
  jwt_shared_secret:
    file: ${JWT_SHARED_SECRET_FILE_PATH:-./secrets/jwt-shared-secret}
