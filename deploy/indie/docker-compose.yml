name: collabhub-indie

x-collabhub-runtime: &collabhub-runtime
  image: ${COLLABHUB_IMAGE:?Set COLLABHUB_IMAGE in .env to a release or immutable certification image}
  restart: unless-stopped
  init: true
  env_file: .env
  networks: [internal]
  secrets: [database_url, redis_url, internal_token, jwt_shared_secret]
  volumes:
    - ./domain-pack.json:/config/domain-pack.json:ro
  stop_grace_period: 45s

x-collabhub-environment: &collabhub-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  INTERNAL_TOKEN_FILE: /run/secrets/internal_token
  JWT_SHARED_SECRET_FILE: /run/secrets/jwt_shared_secret
  COLLABHUB_DOMAIN_PACK_CONFIG: /config/domain-pack.json
  JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-collabhub}
  PG_POOL_MAX: "5"
  MAX_PAYLOAD_BYTES: "131072"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: collabhub
      POSTGRES_DB: collabhub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
    shm_size: 128mb
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabhub -d collabhub"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    init: true
    command:
      - sh
      - -ec
      - exec redis-server --appendonly no --save '' --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 128mb --maxmemory-policy noeviction
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    secrets: [redis_password]
    networks: [internal]

  worker:
    <<: *collabhub-runtime
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1152m
    environment:
      <<: *collabhub-environment
      COLLABHUB_ROLE: worker
      INSTANCE_ID: indie-worker
      INTERNAL_URL: http://worker:7100
      PORT: "7100"
      NODE_OPTIONS: --max-old-space-size=640
      RSS_LIMIT_BYTES: "1006632960"
      SNAPSHOT_INTERVAL: "100"
      MAX_RECOVERY_GAP: "100"
      MAX_ROOM_MAILBOX: "128"
      MAX_WARM_ROOMS: "200"
      IDLE_ROOM_MS: "600000"
      ROOM_CACHE_SCAN_INTERVAL_MS: "30000"
      WAL_RETENTION_VERSIONS: "1000"
      SNAPSHOTS_PER_DOCUMENT: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7100/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  gateway:
    <<: *collabhub-runtime
    depends_on:
      worker: { condition: service_healthy }
    mem_limit: 640m
    networks: [edge, internal]
    ports:
      - 127.0.0.1:${COLLABHUB_LOOPBACK_PORT:-17000}:7000
    environment:
      <<: *collabhub-environment
      COLLABHUB_ROLE: gateway
      INSTANCE_ID: indie-gateway
      PORT: "7000"
      NODE_OPTIONS: --max-old-space-size=320
      RSS_LIMIT_BYTES: "536870912"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      TRUST_PROXY_HEADERS: "true"
      MAX_GATEWAY_CONNECTIONS: "500"
      MAX_CONNECTIONS_PER_IP: "20"
      OPERATION_RATE_PER_SECOND: "30"
      OPERATION_BURST: "60"
      HTTP_RATE_PER_SECOND: "20"
      HTTP_BURST: "40"
      MAX_SOCKET_BUFFER_BYTES: "524288"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      COLLABHUB_HOST: ${COLLABHUB_HOST:?Set COLLABHUB_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    mem_limit: 128m
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://gateway:7000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12

secrets:
  postgres_password: { file: ./secrets/postgres-password }
  redis_password: { file: ./secrets/redis-password }
  database_url: { file: ./secrets/database-url }
  redis_url: { file: ./secrets/redis-url }
  internal_token: { file: ./secrets/internal-token }
  jwt_shared_secret: { file: ./secrets/jwt-shared-secret }

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  internal:
    internal: true
