apiVersion: v1
kind: Namespace
metadata:
  name: collabhub
---
apiVersion: v1
kind: Secret
metadata:
  name: collabhub-runtime
  namespace: collabhub
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@MANAGED_POSTGRES:5432/collabhub
  REDIS_URL: rediss://MANAGED_REDIS:6379
  INTERNAL_TOKEN: REPLACE_WITH_A_RANDOM_SECRET
  JWT_SHARED_SECRET: REPLACE_WITH_ANOTHER_RANDOM_32_BYTE_SECRET
  JWT_ISSUER: my-app
  JWT_AUDIENCE: collabhub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collabhub-domain-pack
  namespace: collabhub
data:
  domain-pack.json: |
    {
      "formatVersion": 1,
      "id": "app.json",
      "schemaVersion": "1.0",
      "initialState": { "id": "$documentId", "title": "Untitled", "items": [], "sections": [] },
      "stalePolicy": {
        "default": "resync",
        "byOperationType": {
          "property.set": "resolve",
          "property.unset": "resolve",
          "entity.create": "resolve",
          "entity.delete": "resolve",
          "entity.restore": "resolve",
          "list.move": "resolve",
          "list.insert": "resolve",
          "transaction.apply": "reject"
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: collabhub-worker-headless
  namespace: collabhub
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: { app: collabhub-worker }
  ports:
    - { name: internal, port: 7100, targetPort: internal }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collabhub-worker
  namespace: collabhub
spec:
  serviceName: collabhub-worker-headless
  podManagementPolicy: Parallel
  replicas: 2
  selector:
    matchLabels: { app: collabhub-worker }
  template:
    metadata:
      labels: { app: collabhub-worker }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collabhub
          image: ghcr.io/superche/collabhub:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: internal, containerPort: 7100 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: COLLABHUB_ROLE, value: worker }
            - { name: PORT, value: "7100" }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: INSTANCE_ID, value: "$(POD_NAME)" }
            - { name: INTERNAL_URL, value: "http://$(POD_NAME).collabhub-worker-headless.collabhub.svc.cluster.local:7100" }
            - { name: COLLABHUB_DOMAIN_PACK_CONFIG, value: /config/domain-pack.json }
            - { name: DATABASE_URL_FILE, value: /run/secrets/collabhub/DATABASE_URL }
            - { name: REDIS_URL_FILE, value: /run/secrets/collabhub/REDIS_URL }
            - { name: INTERNAL_TOKEN_FILE, value: /run/secrets/collabhub/INTERNAL_TOKEN }
            - { name: JWT_SHARED_SECRET_FILE, value: /run/secrets/collabhub/JWT_SHARED_SECRET }
            - { name: PG_POOL_MAX, value: "10" }
            - { name: MAX_WARM_ROOMS, value: "1000" }
            - { name: IDLE_ROOM_MS, value: "60000" }
            - { name: ROOM_CACHE_SCAN_INTERVAL_MS, value: "3000" }
            - { name: WAL_RETENTION_VERSIONS, value: "1000" }
            - { name: RECEIPT_TTL_MS, value: "604800000" }
            - { name: DELIVERED_OUTBOX_TTL_MS, value: "86400000" }
            - { name: SNAPSHOTS_PER_DOCUMENT, value: "3" }
            - { name: COMPACTION_INTERVAL_MS, value: "600000" }
            - { name: MAX_PAYLOAD_BYTES, value: "131072" }
            - { name: NODE_OPTIONS, value: --max-old-space-size=896 }
          volumeMounts:
            - { name: domain-pack, mountPath: /config, readOnly: true }
            - { name: runtime-secrets, mountPath: /run/secrets/collabhub, readOnly: true }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe: { httpGet: { path: /readyz, port: internal }, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: internal }, periodSeconds: 10, timeoutSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
      volumes:
        - name: domain-pack
          configMap: { name: collabhub-domain-pack }
        - name: runtime-secrets
          secret: { secretName: collabhub-runtime, defaultMode: 0400 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabhub-gateway
  namespace: collabhub
spec:
  replicas: 2
  selector:
    matchLabels: { app: collabhub-gateway }
  template:
    metadata:
      labels: { app: collabhub-gateway }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collabhub
          image: ghcr.io/superche/collabhub:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 7000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: COLLABHUB_ROLE, value: gateway }
            - { name: PORT, value: "7000" }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: INSTANCE_ID, value: "$(POD_NAME)" }
            - { name: COLLABHUB_DOMAIN_PACK_CONFIG, value: /config/domain-pack.json }
            - { name: DATABASE_URL_FILE, value: /run/secrets/collabhub/DATABASE_URL }
            - { name: REDIS_URL_FILE, value: /run/secrets/collabhub/REDIS_URL }
            - { name: INTERNAL_TOKEN_FILE, value: /run/secrets/collabhub/INTERNAL_TOKEN }
            - { name: JWT_SHARED_SECRET_FILE, value: /run/secrets/collabhub/JWT_SHARED_SECRET }
            - { name: JWT_ISSUER, valueFrom: { secretKeyRef: { name: collabhub-runtime, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { secretKeyRef: { name: collabhub-runtime, key: JWT_AUDIENCE } } }
            - { name: ALLOWED_ORIGINS, value: "https://YOUR_APP" }
            - { name: TRUST_PROXY_HEADERS, value: "true" }
            - { name: PG_POOL_MAX, value: "10" }
            - { name: MAX_GATEWAY_CONNECTIONS, value: "10000" }
            - { name: MAX_CONNECTIONS_PER_IP, value: "50" }
            - { name: OPERATION_RATE_PER_SECOND, value: "30" }
            - { name: OPERATION_BURST, value: "60" }
            - { name: MAX_PAYLOAD_BYTES, value: "131072" }
            - { name: NODE_OPTIONS, value: --max-old-space-size=896 }
          volumeMounts:
            - { name: domain-pack, mountPath: /config, readOnly: true }
            - { name: runtime-secrets, mountPath: /run/secrets/collabhub, readOnly: true }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, timeoutSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
      volumes:
        - name: domain-pack
          configMap: { name: collabhub-domain-pack }
        - name: runtime-secrets
          secret: { secretName: collabhub-runtime, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: collabhub-gateway
  namespace: collabhub
spec:
  type: LoadBalancer
  selector: { app: collabhub-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collabhub-gateway
  namespace: collabhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: collabhub-gateway }
  minReplicas: 2
  maxReplicas: 30
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collabhub-worker
  namespace: collabhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: StatefulSet, name: collabhub-worker }
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown: { stabilizationWindowSeconds: 600 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collabhub-gateway
  namespace: collabhub
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: collabhub-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collabhub-worker
  namespace: collabhub
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: collabhub-worker }
