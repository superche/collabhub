services:
  - type: web
    name: collabhub-demo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/demo.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: COLLABHUB_DEMO_ROOM_IDLE_TTL_MS, value: "1800000" }
      - { key: COLLABHUB_DEMO_MAX_WARM_ROOMS, value: "500" }
      - { key: COLLABHUB_DEMO_ROOM_SCAN_INTERVAL_MS, value: "60000" }
      - { key: COLLABHUB_DEMO_MAX_CONNECTIONS, value: "250" }
      - { key: COLLABHUB_DEMO_MAX_CONNECTIONS_PER_IP, value: "8" }
      - { key: COLLABHUB_DEMO_MAX_ACTIVE_ROOMS, value: "500" }
      - { key: COLLABHUB_DEMO_MESSAGE_RATE_PER_SECOND, value: "30" }
      - { key: COLLABHUB_DEMO_MESSAGE_BURST, value: "60" }
      - { key: COLLABHUB_DEMO_TRUST_PROXY_HEADERS, value: "true" }
      - { key: COLLABHUB_DEMO_ALLOWED_ORIGINS, value: "https://collabhub-demo.onrender.com" }
