name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm release:check
      - run: pnpm smoke:fresh-react
      - run: pnpm smoke:existing-react
      - run: pnpm test:e2e
      - run: pnpm smoke:demo

  local-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke:todo-cluster

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/distributed.Dockerfile
            tag: runtime
          - dockerfile: deploy/docker/demo.Dockerfile
            tag: demo
          - dockerfile: deploy/docker/standalone.Dockerfile
            tag: standalone
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: collabhub/ci:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.29.14
      - run: docker compose -f deploy/local/docker-compose.yml config --quiet
      - run: kubectl kustomize deploy/kubernetes/base > /dev/null
      - run: terraform fmt -check -recursive deploy/aws/terraform
      - run: terraform -chdir=deploy/aws/terraform init -backend=false
      - run: terraform -chdir=deploy/aws/terraform validate
      - run: terraform fmt -check -recursive deploy/alicloud/terraform
      - run: terraform -chdir=deploy/alicloud/terraform init -backend=false
      - run: terraform -chdir=deploy/alicloud/terraform validate
