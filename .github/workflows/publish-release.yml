name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version already committed to every public package
        required: true
      confirmation:
        description: Type PUBLISH_STABLE_RELEASE
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_STABLE_RELEASE'
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with Trusted Publishing support
        run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-release-version.mjs "$VERSION"
      - run: pnpm release:check
      - run: pnpm smoke:fresh-react
      - run: pnpm smoke:existing-react
      - run: pnpm test:e2e
      - run: pnpm smoke:demo
      - run: pnpm smoke:postgres-hardening
      - run: pnpm pack:packages
      - name: Create release draft for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" artifacts/packages/*.tgz \
            --draft --target "$GITHUB_SHA" --title "CollabHub ${VERSION}" \
            --notes-file "docs/release-notes-${VERSION}.md"
      - name: Publish npm packages with provenance
        run: |
          for archive in artifacts/packages/*.tgz; do
            npm publish "$archive" --registry=https://registry.npmjs.org --access=public --provenance
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/distributed.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/superche/collabhub:${{ inputs.expected_version }}
            ghcr.io/superche/collabhub:1
            ghcr.io/superche/collabhub:latest
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/standalone.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/superche/collabhub-standalone:${{ inputs.expected_version }}
            ghcr.io/superche/collabhub-standalone:1
            ghcr.io/superche/collabhub-standalone:latest
          provenance: mode=max
          sbom: true
      - name: Publish release and lock its tag and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${VERSION}" --draft=false
