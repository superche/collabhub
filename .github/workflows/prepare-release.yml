name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version already committed to every package
        required: true
        default: 0.1.0
      confirmation:
        description: Type PREPARE_ONLY; this workflow never publishes
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.confirmation == 'PREPARE_ONLY'
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-version.mjs "${{ inputs.expected_version }}"
      - run: pnpm release:check
      - run: pnpm pack:packages
      - uses: actions/upload-artifact@v4
        with:
          name: collabhub-${{ inputs.expected_version }}-packages
          path: artifacts/packages/*.tgz
          if-no-files-found: error
          retention-days: 7
