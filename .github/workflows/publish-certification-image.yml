name: Publish certification image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/distributed.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/superche/collabhub:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - run: echo "ghcr.io/superche/collabhub:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
